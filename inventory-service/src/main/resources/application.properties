spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.163.128:3306/inventory-service
spring.datasource.username=invertory-user
spring.datasource.password=invertory-pass
spring.jpa.hibernate.ddl-auto=create
server.port=8082
#show sql queries
spring.jpa.show-sql=true

### EUREKA CLIENT ###
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
spring.application.name=inventory-service


management.zipkin.tracing.endpoint=http://192.168.163.128:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# Actuator Prometheus Endpoint
management.endpoints.web.exposure.include= prometheus
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]