server.port=8084
### EUREKA CLIENT ###
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
spring.application.name=notification-service
logging.level.org.springframework.cloud.client.loadbalancer=DEBUG

management.zipkin.tracing.endpoint=http://192.168.163.128:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# Kafka Properties
spring.kafka.bootstrap-servers=192.168.163.128:29092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.programmingtechie.orderservice.event.OrderPlacedEvent